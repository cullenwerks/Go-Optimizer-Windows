name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (e.g. 2.1.0)'
        required: false
        default: 'dev'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows (${{ matrix.arch }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            suffix: x64
            cc: x86_64-w64-mingw32-gcc
            cross: false

          - arch: arm64
            suffix: arm64
            cc: aarch64-w64-mingw32-clang
            cross: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.version }}" && "${{ github.event.inputs.version }}" != "dev" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install llvm-mingw (ARM64 cross-compiler)
        if: matrix.cross
        shell: bash
        run: |
          # llvm-mingw provides aarch64-w64-mingw32-clang needed for CGO cross-compile to Windows ARM64
          LLVM_VER="20250114"
          ARCHIVE="llvm-mingw-${LLVM_VER}-ucrt-x86_64.zip"
          curl -fsSL -o "$ARCHIVE" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_VER}/${ARCHIVE}"
          7z x "$ARCHIVE" -o"C:/llvm-mingw" -y > /dev/null
          # The zip contains a single subdirectory; add its bin to PATH
          LLVM_BIN=$(ls -d C:/llvm-mingw/llvm-mingw-*/bin 2>/dev/null | head -1)
          echo "$LLVM_BIN" >> "$GITHUB_PATH"

      - name: Generate icon.ico from SVG
        if: hashFiles('assets/icon.svg') != ''
        shell: bash
        run: |
          magick assets/icon.svg \
            -define icon:auto-resize=256,48,32,16 \
            assets/icon.ico

      - name: Install rsrc (icon embedding)
        shell: bash
        run: go install github.com/akavel/rsrc@latest

      - name: Embed icon resource
        if: hashFiles('assets/icon.ico') != ''
        shell: bash
        run: |
          rsrc -ico assets/icon.ico -arch ${{ matrix.arch }} -o rsrc_windows_${{ matrix.arch }}.syso

      - name: Build ${{ matrix.suffix }}
        shell: bash
        env:
          GOOS: windows
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc }}
        run: |
          go build \
            -tags gui \
            -ldflags="-s -w -H=windowsgui" \
            -trimpath \
            -o "SysCleaner-${{ matrix.suffix }}.exe" \
            .

      - name: Clean up .syso
        if: always()
        shell: bash
        run: rm -f rsrc_windows_*.syso

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SysCleaner-${{ matrix.suffix }}
          path: SysCleaner-${{ matrix.suffix }}.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Publish on tag pushes or manual workflow_dispatch
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Resolve release name
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "name=SysCleaner ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.version }}" && "${{ github.event.inputs.version }}" != "dev" ]]; then
            echo "name=SysCleaner v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            SHORT="${GITHUB_SHA::7}"
            echo "name=SysCleaner dev-${SHORT}" >> "$GITHUB_OUTPUT"
            echo "tag=dev-${SHORT}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          NAME="${{ steps.release.outputs.name }}"
          PRERELEASE=""
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE="--prerelease"
          fi

          # Create (or update if already exists) the release, then upload assets.
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "$NAME" \
            --generate-notes \
            $PRERELEASE \
            artifacts/SysCleaner-x64/SysCleaner-x64.exe \
            artifacts/SysCleaner-arm64/SysCleaner-arm64.exe \
          || gh release upload "$TAG" \
            --repo "$REPO" \
            --clobber \
            artifacts/SysCleaner-x64/SysCleaner-x64.exe \
            artifacts/SysCleaner-arm64/SysCleaner-arm64.exe
