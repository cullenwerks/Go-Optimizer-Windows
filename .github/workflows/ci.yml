name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test & Build Check
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        shell: bash
        run: go vet ./...

      - name: Test
        shell: bash
        run: go test ./...

      - name: Generate icon.ico from SVG
        if: hashFiles('assets/icon.svg') != ''
        shell: bash
        run: |
          magick assets/icon.svg \
            -define icon:auto-resize=256,48,32,16 \
            assets/icon.ico

      - name: Build check (GUI)
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "1"
          CC: x86_64-w64-mingw32-gcc
        run: |
          go build \
            -tags gui \
            -ldflags="-s -w -H=windowsgui" \
            -trimpath \
            -o /dev/null \
            .
